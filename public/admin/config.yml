backend:
  name: github
  repo: Alina41946/dreamNook
  branch: main
  base_url: https://dreamnook-decap-oauth.heemiii2024.workers.dev

media_folder: public/images/uploads
public_folder: /dreamNook/images/uploads

collections:
  - name: articles
    label: 文章
    folder: src/content/articles
    create: true
    path: '{{slug}}/index'

    media_folder: ''
    public_folder: ''

    fields:
      - label: 標題
        name: title
        widget: string

      - label: 摘要
        name: description
        widget: text

      - label: 發布日期
        name: pubDate
        widget: datetime

      - label: 分類
        name: category
        widget: select
        options:
          - 語言學習
          - 日本打工
          - 旅遊
          - 作品集

      - label: 作品類型
        name: portfolioType
        widget: select
        required: false
        options:
          - 網頁設計
          - 頻道包裝
          - 平面設計
          - 影像

      - label: 文章圖片
        name: image
        widget: image
        required: false

      - label: 標籤
        name: tags
        widget: list
        required: false

      - label: 不收錄搜尋引擎
        name: noindex
        widget: boolean
        default: false

      - label: 文章內容
        name: body
        widget: markdown
